name: Resona
options:
  bundleIdPrefix: com.resona
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: X4W8MM3KJG
    CODE_SIGN_STYLE: Automatic
targets:
  Resona:
    type: application
    platform: iOS
    sources:
      - path: Sources/Resona
    info:
      path: Sources/Resona/Info.plist
      properties:
        CFBundleDisplayName: Resona
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.resona.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - ResonaTests
        - ResonaUITests
      commandLineArguments: []
  ResonaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ResonaTests
    dependencies:
      - target: Resona
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  ResonaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ResonaUITests
    dependencies:
      - target: Resona
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
