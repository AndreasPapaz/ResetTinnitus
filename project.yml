name: ResetTinnitus
options:
  bundleIdPrefix: com.resettinnitus
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  ResetTinnitus:
    type: application
    platform: iOS
    sources:
      - path: Sources/ResetTinnitus
    info:
      path: Sources/ResetTinnitus/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.resettinnitus.app
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - ResetTinnitusTests
        - ResetTinnitusUITests
      commandLineArguments: []
  ResetTinnitusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ResetTinnitusTests
    dependencies:
      - target: ResetTinnitus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ResetTinnitusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ResetTinnitusUITests
    dependencies:
      - target: ResetTinnitus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
